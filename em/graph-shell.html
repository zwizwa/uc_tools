    html, body {
      margin: 0;

    body {
      display: flex;

      justify-content: center;
    }
    canvas {
      border: 0;
      display: block;
      /* Let SDL/emscripten own the pixel size; this just caps display size. */
      max-width: 100%;
      max-height: 80vh;
    }
    #log {
      width: 800px;
      max-width: 100%;
      height: 6em;
      margin-top: 8px;
      overflow-y: auto;
      white-space: pre-wrap;
      opacity: 0.7;
    }
  </style>

<body>
  <!-- tabindex makes the canvas focusable so keydown (your ESC handler) works
       Emscripten code will look for canvas in Module.canvas, set up below
    -->
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var Module = {
      canvas: (function () {
        var c = document.getElementById('canvas');
        // Reload the page if the WebGL context is lost rather than failing silently.
        c.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost. Reloading.');
          e.preventDefault();
        }, false);
        return c;
      })(),
    };
  </script>

</body>
