<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebGL Graph</title>
<style>html,body{margin:0}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const gl = document.getElementById("c").getContext("webgl");
gl.canvas.width = innerWidth; gl.canvas.height = innerHeight;
gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

const vs = `
attribute vec2 p;   // p.x in [-1,1], p.y = function value
void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const fs = `
precision mediump float;
void main(){ gl_FragColor = vec4(0.1, 0.9, 0.4, 1.0); }`;

function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
const loc = gl.getAttribLocation(prog, "p");
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// data: interleaved [x0,y0, x1,y1, ...], already in clip space [-1,1].
// This is what you'd hand over from emscripten as a Float32Array.
function draw(data){
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.clearColor(0.07, 0.07, 0.09, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.LINE_STRIP, 0, data.length / 2);
}

// --- demo data (replace with your C-generated array) ---
const N = 512;
const demo = new Float32Array(N * 2);
for(let i = 0; i < N; i++){
  const x = -1 + 2 * i / (N - 1);
  demo[2*i]   = x;
  demo[2*i+1] = 0.8 * Math.sin(x * 6.2831853);
}
draw(demo);
</script>
</body>
</html>
