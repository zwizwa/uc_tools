<!doctype html>
<html><head><meta charset="utf-8"><title>i686 console</title>
<style>
body { margin: 0; font: 14px monospace; background: #111; color: #ddd; }
#out { height: calc(100vh - 3em); overflow-y: auto; white-space: pre-wrap; padding: 0.5em; }
#in { width: 100%; box-sizing: border-box; font: inherit; background: #222; color: #fff; border: 0; padding: 0.5em; }
</style></head>
<body><div id="out"></div><input id="in" autofocus placeholder="forth">
<script>
const out = document.getElementById("out"), inp = document.getElementById("in");
const dec = new TextDecoder(), enc = new TextEncoder();
const show = t => { out.textContent += t; out.scrollTop = out.scrollHeight; };
let ws;
function connect() {
    ws = new WebSocket("ws://" + location.host + "/ws");
    ws.binaryType = "arraybuffer";
    ws.onmessage = e => show(dec.decode(e.data).replaceAll("\r", ""));
    ws.onclose = () => { show("[closed]\n"); setTimeout(connect, 2000); };
}
inp.onkeydown = e => {
    if (e.key != "Enter") return;
    show(inp.value + "\n");
    ws.send(enc.encode(inp.value));
    inp.value = "";
};
connect();
</script></body></html>
